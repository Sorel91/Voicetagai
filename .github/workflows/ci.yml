name: CI
on:
  push:
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: pip install 'numpy>=1.24,<3'
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'
